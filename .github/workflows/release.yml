name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: flashr-tui

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
            use_cross: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive_ext: tar.gz
            use_cross: true
          - os: macos-13
            target: x86_64-apple-darwin
            archive_ext: tar.gz
            use_cross: false
          - os: macos-14
            target: aarch64-apple-darwin
            archive_ext: tar.gz
            use_cross: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip
            use_cross: false

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            cargo_version=$(grep '^version = ' Cargo.toml | head -n1 | cut -d '"' -f2)
            echo "value=$cargo_version" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build binary
        shell: bash
        run: |
          if [[ "${{ matrix.use_cross }}" == "true" ]]; then
            cross build --release --locked --target "${{ matrix.target }}"
          else
            cargo build --release --locked --target "${{ matrix.target }}"
          fi

      - name: Stage release files
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.value }}"
          target="${{ matrix.target }}"
          ext="${{ matrix.archive_ext }}"
          artifact_name="${{ env.BINARY_NAME }}-v${version}-${target}"

          mkdir -p dist

          if [[ "${{ runner.os }}" == "Windows" ]]; then
            binary_path="target/${target}/release/${{ env.BINARY_NAME }}.exe"
            cp "$binary_path" "dist/${{ env.BINARY_NAME }}.exe"
            cp README.md dist/README.md
            cp CHANGELOG.md dist/CHANGELOG.md
            for f in LICENSE LICENSE-MIT LICENSE-APACHE; do
              [[ -f "$f" ]] && cp "$f" "dist/$f"
            done
            powershell -Command "Compress-Archive -Path dist/* -DestinationPath '${artifact_name}.${ext}'"
            rm -rf dist
          else
            binary_path="target/${target}/release/${{ env.BINARY_NAME }}"
            cp "$binary_path" "dist/${{ env.BINARY_NAME }}"
            cp README.md dist/README.md
            cp CHANGELOG.md dist/CHANGELOG.md
            for f in LICENSE LICENSE-MIT LICENSE-APACHE; do
              [[ -f "$f" ]] && cp "$f" "dist/$f"
            done
            tar -C dist -czf "${artifact_name}.${ext}" .
            rm -rf dist
          fi

          echo "artifact_name=${artifact_name}" >> "$GITHUB_OUTPUT"
          echo "archive_name=${artifact_name}.${ext}" >> "$GITHUB_OUTPUT"

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.stage.outputs.archive_name }}
          path: ${{ steps.stage.outputs.archive_name }}
          if-no-files-found: error

  publish:
    name: Publish release assets
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4.1.3
        with:
          path: dist

      - name: Flatten release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find dist -type f -maxdepth 2 -print0 | xargs -0 -I{} mv {} release-assets/
          rm -rf dist
          ls -lah release-assets

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum * > SHA256SUMS.txt

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: release-assets/flashr-tui-sbom.spdx.json

      - name: Optional GPG signature
        if: ${{ secrets.GPG_PRIVATE_KEY != '' && secrets.GPG_PASSPHRASE != '' }}
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          echo "$GPG_PRIVATE_KEY" | base64 --decode | gpg --batch --import
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
            --armor --detach-sign release-assets/SHA256SUMS.txt

      - name: Optional cosign signature
        if: ${{ secrets.COSIGN_PRIVATE_KEY != '' && secrets.COSIGN_PASSWORD != '' }}
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        uses: sigstore/cosign-installer@v3.8.1

      - name: Sign checksums with cosign
        if: ${{ secrets.COSIGN_PRIVATE_KEY != '' && secrets.COSIGN_PASSWORD != '' }}
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          cosign sign-blob --key env://COSIGN_PRIVATE_KEY \
            --output-signature release-assets/SHA256SUMS.txt.cosign.sig \
            release-assets/SHA256SUMS.txt

      - name: Create build provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'release-assets/*'

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/*
